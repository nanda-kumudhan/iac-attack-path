name: Delivery checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Ensure the shipped Action matches its source
        run: git diff --exit-code -- lib/action.cjs
      - name: Smoke-test report delivery (synthetic only)
        uses: ./
        with:
          report-file: examples/reports/demo.json
          output-directory: iac-report
          allow-demo: 'true'
          fail-on-introduced: 'false'
