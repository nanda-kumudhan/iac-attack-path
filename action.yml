name: IaC Attack Path Report
description: Format a precomputed attack-path report and gate introduced paths. Analysis engine required separately.
branding:
  icon: shield
  color: blue
inputs:
  report-file:
    description: Path to a v1 JSON report emitted by your hand-written engine
    required: true
  output-directory:
    description: Directory for report.md and report.sarif
    default: iac-report
  fail-on-introduced:
    description: Fail for introduced paths, including possible paths
    default: 'true'
  allow-demo:
    description: Accept synthetic demonstration reports; never enable for a security gate
    default: 'false'
  post-comment:
    description: Publish report details to the current PR (explicit opt-in)
    default: 'false'
  github-token:
    description: Token with pull-requests write permission; only used for opted-in comments
    required: false
outputs:
  introduced-count:
    description: Number of paths labelled introduced by the engine
  markdown-file:
    description: Absolute path to the generated Markdown report
  sarif-file:
    description: Absolute path to the generated SARIF report
runs:
  using: node24
  main: lib/action.cjs
