name: IaC Attack Path Checker
description: Compare Terraform plans offline, find introduced internet-to-data paths and compute minimum blocking edits.
branding:
  icon: shield
  color: blue
inputs:
  base-plan:
    description: Base terraform show -json plan; required together with head-plan
    required: false
  head-plan:
    description: Head terraform show -json plan
    required: false
  report-file:
    description: Alternatively consume a precomputed v1 report; cannot be combined with plans
    required: false
  output-directory:
    description: Directory for JSON, Markdown and SARIF reports
    default: iac-report
  fail-on-introduced:
    description: Fail for introduced paths, including possible paths
    default: 'true'
  allow-demo:
    description: Accept synthetic reports for presentation tests only
    default: 'false'
  post-comment:
    description: Publish findings to the current PR (explicit opt-in)
    default: 'false'
  github-token:
    description: Token with pull-requests write permission; used only for opted-in comments
    required: false
outputs:
  introduced-count:
    description: Number of introduced paths
  report-file:
    description: Absolute path to the generated JSON report
  markdown-file:
    description: Absolute path to the generated Markdown report
  sarif-file:
    description: Absolute path to the generated SARIF report
runs:
  using: node24
  main: lib/action.cjs
